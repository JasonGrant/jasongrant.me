name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Run Lighthouse CI (${{ matrix.preset }})
        run: npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.${{ matrix.preset }}.json

  axe:
    name: axe-core WCAG 2.1 AA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Next.js
        run: |
          npm run start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000; then echo "ready"; exit 0; fi
            sleep 1
          done
          echo "server failed to start"; cat server.log; exit 1

      - name: Run axe-core via Playwright against all routes
        run: node scripts/axe-check.mjs
